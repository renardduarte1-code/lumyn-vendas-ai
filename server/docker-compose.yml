version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lumyn-prospect-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumyn_prospect
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d lumyn_prospect']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
